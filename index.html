<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epicycles SVG Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Epicycles SVG Animation</h1>
            <p>Upload an SVG file to trace its path with epicycles</p>
        </header>
        
        <div class="controls">
            <div class="upload-section">
                <label for="svg-upload" class="upload-label">
                    <span class="upload-text">Choose SVG File</span>
                    <input type="file" id="svg-upload" accept=".svg" />
                </label>
                <span id="file-name" class="file-name"></span>
            </div>
            
            <button id="generate-btn" class="generate-btn" disabled>Generate Epicycles</button>
            
            <div class="settings">
                <label>
                    Number of Epicycles:
                    <input type="range" id="epicycle-count" min="10" max="200" value="100" step="1">
                    <span id="count-value">100</span>
                </label>
                <label>
                    Animation Speed:
                    <input type="range" id="animation-speed" min="0.5" max="5" value="1" step="0.1">
                    <span id="speed-value">1.0x</span>
                </label>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="animation-canvas"></canvas>
        </div>
        
        <div id="status" class="status"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
